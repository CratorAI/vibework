name: Pull request checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: node scripts/version.mjs --check
      - run: bun run prepare:opencode && bun run prepare:skills
      - run: bunx tsc --noEmit
      - run: bunx vitest run
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
        env:
          RUSTFLAGS: -D warnings
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: gitleaks dir --redact=100 .
      - run: gitleaks git --log-opts=--all --redact=100
